<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Robot AI Planner Icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- Antenna -->
  <circle cx="128" cy="54" r="10" fill="#22d3ee"/>
  <rect x="124" y="64" width="8" height="18" rx="4" fill="#22d3ee"/>

  <!-- Robot head -->
  <rect x="56" y="86" width="144" height="112" rx="24" fill="url(#accent)"/>

  <!-- Eyes -->
  <circle cx="98" cy="138" r="14" fill="#0b1020"/>
  <circle cx="158" cy="138" r="14" fill="#0b1020"/>
  <circle cx="93" cy="133" r="4" fill="#ffffff" opacity="0.9"/>
  <circle cx="153" cy="133" r="4" fill="#ffffff" opacity="0.9"/>

  <!-- Mouth -->
  <rect x="96" y="166" width="64" height="10" rx="5" fill="#0b1020" opacity="0.85"/>

  <!-- Subtle bottom highlight -->
  <ellipse cx="128" cy="212" rx="70" ry="10" fill="#000000" opacity="0.1"/>
</svg>
